<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FinTrack | Add Transaction</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/form.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>

  <nav class="navbar">
    <div class="nav-logo">FinTrack</div>
    <ul class="nav-links">
      <li><a href="index.html">Dashboard</a></li>
      <li><a href="add-transaction.html" class="active">Add</a></li>
      <li><a href="history.html">History</a></li>
      <li><a href="reports.html">Reports</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu">&#9776;</button>
  </nav>

  <main class="form-main">
    <div class="form-card">
      <h1 class="form-title">Add Transaction</h1>
      <p class="form-subtitle">Record a new income or expense</p>

      <form id="transaction-form" novalidate>

        <div class="type-toggle">
          <button type="button" class="toggle-btn active" id="btn-expense">Expense</button>
          <button type="button" class="toggle-btn" id="btn-income">Income</button>
        </div>
        <input type="hidden" id="transaction-type" value="expense"/>

        <div class="form-group">
          <label for="title">Title <span class="required">*</span></label>
          <input type="text" id="title" placeholder="e.g. Grocery shopping" maxlength="60"/>
          <span class="error-msg" id="error-title"></span>
        </div>

        <div class="form-group">
          <label for="amount">Amount (₹) <span class="required">*</span></label>
          <input type="number" id="amount" placeholder="0.00" min="0" step="0.01"/>
          <span class="error-msg" id="error-amount"></span>
        </div>

        <div class="form-group">
          <label for="category">Category <span class="required">*</span></label>
          <select id="category">
            <option value="">-- Select category --</option>
            <optgroup label="Expense Categories">
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Health">Health</option>
              <option value="Education">Education</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other Expense">Other</option>
            </optgroup>
            <optgroup label="Income Categories">
              <option value="Salary">Salary</option>
              <option value="Freelance">Freelance</option>
              <option value="Investment">Investment</option>
              <option value="Gift">Gift</option>
              <option value="Other Income">Other</option>
            </optgroup>
          </select>
          <span class="error-msg" id="error-category"></span>
        </div>

        <div class="form-group">
          <label for="date">Date <span class="required">*</span></label>
          <input type="date" id="date"/>
          <span class="error-msg" id="error-date"></span>
        </div>

        <div class="form-group">
          <label for="note">Note (optional)</label>
          <textarea id="note" placeholder="Any additional details..." rows="3" maxlength="200"></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary">Save Transaction</button>
          <button type="reset" class="btn-ghost" id="clear-btn">Clear</button>
        </div>

        <div class="success-msg" id="success-msg" role="alert" aria-live="polite"></div>

      </form>
    </div>
  </main>

  <footer class="site-footer">
    <span>FinTrack &copy; 2026 | CSE 106 Project</span>
  </footer>

  <script>
    // ── Storage Utilities ──────────────────────────────────────────
    const Storage = (() => {
      const TK = 'fintrack_transactions';

      function getTransactions() {
        const d = localStorage.getItem(TK);
        return d ? JSON.parse(d) : [];
      }
      function saveTransactions(list) {
        localStorage.setItem(TK, JSON.stringify(list));
      }
      function addTransaction(t) {
        const list = getTransactions();
        t.id = Date.now().toString();
        t.createdAt = new Date().toISOString();
        list.unshift(t);
        saveTransactions(list);
        return t;
      }
      return { addTransaction };
    })();

    // ── Set today's date as default & max ──────────────────────────
    function setTodayDate() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('date').value = today;
      document.getElementById('date').max = today;
    }

    // ── Income / Expense Toggle ────────────────────────────────────
    function initTypeToggle() {
      const btnExpense = document.getElementById('btn-expense');
      const btnIncome  = document.getElementById('btn-income');
      const typeInput  = document.getElementById('transaction-type');

      btnExpense.addEventListener('click', () => {
        btnExpense.classList.add('active');
        btnIncome.classList.remove('active');
        typeInput.value = 'expense';
      });

      btnIncome.addEventListener('click', () => {
        btnIncome.classList.add('active');
        btnExpense.classList.remove('active');
        typeInput.value = 'income';
      });
    }

    // ── Form Validation ────────────────────────────────────────────
    function validateForm() {
      let isValid = true;
      clearAllErrors();

      const title    = document.getElementById('title').value.trim();
      const amount   = document.getElementById('amount').value;
      const category = document.getElementById('category').value;
      const date     = document.getElementById('date').value;

      if (!title) {
        showError('title', 'Title is required.');
        isValid = false;
      } else if (title.length < 2) {
        showError('title', 'Title must be at least 2 characters.');
        isValid = false;
      }

      if (!amount) {
        showError('amount', 'Amount is required.');
        isValid = false;
      } else if (parseFloat(amount) <= 0) {
        showError('amount', 'Amount must be greater than 0.');
        isValid = false;
      }

      if (!category) {
        showError('category', 'Please select a category.');
        isValid = false;
      }

      if (!date) {
        showError('date', 'Date is required.');
        isValid = false;
      }

      return isValid;
    }

    // ── Save Transaction ───────────────────────────────────────────
    function saveTransaction() {
      const transaction = {
        title    : document.getElementById('title').value.trim(),
        amount   : parseFloat(document.getElementById('amount').value),
        category : document.getElementById('category').value,
        date     : document.getElementById('date').value,
        note     : document.getElementById('note').value.trim(),
        type     : document.getElementById('transaction-type').value
      };

      Storage.addTransaction(transaction);

      // Show success message
      const msg = document.getElementById('success-msg');
      msg.textContent = '✓ Transaction saved successfully!';
      msg.classList.add('show');

      // Reset form
      document.getElementById('transaction-form').reset();
      setTodayDate();
      document.getElementById('btn-expense').classList.add('active');
      document.getElementById('btn-income').classList.remove('active');
      document.getElementById('transaction-type').value = 'expense';

      setTimeout(() => {
        msg.textContent = '';
        msg.classList.remove('show');
      }, 3000);
    }

    // ── Error Helpers ──────────────────────────────────────────────
    function showError(fieldId, message) {
      const errEl   = document.getElementById('error-' + fieldId);
      const inputEl = document.getElementById(fieldId);
      if (errEl)   errEl.textContent = message;
      if (inputEl) inputEl.classList.add('input-error');
    }

    function clearError(fieldId) {
      const errEl   = document.getElementById('error-' + fieldId);
      const inputEl = document.getElementById(fieldId);
      if (errEl)   errEl.textContent = '';
      if (inputEl) inputEl.classList.remove('input-error');
    }

    function clearAllErrors() {
      ['title', 'amount', 'category', 'date'].forEach(clearError);
    }

    // ── Hamburger ──────────────────────────────────────────────────
    function initHamburger() {
      document.getElementById('hamburger').addEventListener('click', () => {
        document.querySelector('.nav-links').classList.toggle('open');
      });
    }

    // ── Init ───────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      setTodayDate();
      initTypeToggle();
      initHamburger();

      // Live clear errors on input
      ['title', 'amount', 'category', 'date'].forEach(id => {
        document.getElementById(id).addEventListener('input',  () => clearError(id));
        document.getElementById(id).addEventListener('change', () => clearError(id));
      });

      // Form submit
      document.getElementById('transaction-form').addEventListener('submit', (e) => {
        e.preventDefault();
        if (validateForm()) saveTransaction();
      });

      // Clear button — reset date and errors too
      document.getElementById('clear-btn').addEventListener('click', () => {
        clearAllErrors();
        document.getElementById('success-msg').textContent = '';
        document.getElementById('success-msg').classList.remove('show');
        setTodayDate();
      });
    });
  </script>

</body>
</html>
