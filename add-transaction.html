<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FinTrack | Add Transaction</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/form.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>
  <nav class="navbar">
    <div class="nav-logo">FinTrack</div>
    <ul class="nav-links">
      <li><a href="index.html">Dashboard</a></li>
      <li><a href="add-transaction.html" class="active">Add</a></li>
      <li><a href="history.html">History</a></li>
      <li><a href="reports.html">Reports</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu">&#9776;</button>
  </nav>

  <main class="form-main">
    <div class="form-card">
      <h1 class="form-title">Add Transaction</h1>
      <p class="form-subtitle">Record a new income or expense</p>

      <form id="transaction-form" novalidate>

        <div class="type-toggle">
          <button type="button" class="toggle-btn active" data-type="expense" id="btn-expense">Expense</button>
          <button type="button" class="toggle-btn" data-type="income" id="btn-income">Income</button>
        </div>
        <input type="hidden" id="transaction-type" value="expense"/>

        <div class="form-group">
          <label for="title">Title <span class="required">*</span></label>
          <input type="text" id="title" placeholder="e.g. Grocery shopping" maxlength="60"/>
          <span class="error-msg" id="error-title"></span>
        </div>

        <div class="form-group">
          <label for="amount">Amount (₹) <span class="required">*</span></label>
          <input type="number" id="amount" placeholder="0.00" min="0" step="0.01"/>
          <span class="error-msg" id="error-amount"></span>
        </div>

        <div class="form-group">
          <label for="category">Category <span class="required">*</span></label>
          <select id="category">
