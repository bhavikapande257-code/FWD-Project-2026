<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FinTrack | Add Entry</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar__inner">
      <div class="navbar__logo">FinTrack</div>
      <ul class="navbar__nav">
        <li><a href="index.html" class="navbar__link">Dashboard</a></li>
        <li><a href="add-transaction.html" class="navbar__link active">Add</a></li>
        <li><a href="history.html" class="navbar__link">History</a></li>
        <li><a href="reports.html" class="navbar__link">Reports</a></li>
      </ul>
    </div>
  </nav>

  <main class="page-container" style="max-width: 600px;">
    <div class="card" style="padding: 40px;">
      <header style="margin-bottom: 30px;">
        <span class="card__label">New Transaction</span>
        <h1 style="font-family: var(--font-display); letter-spacing: -1px;">Commit to Ledger</h1>
      </header>

      <form id="transaction-form" novalidate>
        <div class="form-group" style="display: flex; gap: 10px; margin-bottom: 30px;">
          <button type="button" class="btn-primary" id="btn-expense" style="flex: 1; background: var(--expense); border-color: var(--expense);">Expenditure (○)</button>
          <button type="button" class="btn-secondary" id="btn-income" style="flex: 1; border: 1px solid var(--border); color: var(--text-muted); font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; cursor: pointer;">Revenue (●)</button>
        </div>
        <input type="hidden" id="transaction-type" value="expense"/>

        <div class="form-group">
          <label class="card__label" for="title">Description <span style="color: var(--expense);">*</span></label>
          <input type="text" id="title" class="form-input" placeholder="e.g. Rare Manuscript Procurement" maxlength="60"/>
          <span id="error-title" style="color: var(--expense); font-size: 10px; display: block; margin-top: 5px;"></span>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
          <div class="form-group">
            <label class="card__label" for="amount">Amount (₹) <span style="color: var(--expense);">*</span></label>
            <input type="number" id="amount" class="form-input" placeholder="0.00" min="0" step="0.01"/>
            <span id="error-amount" style="color: var(--expense); font-size: 10px; display: block; margin-top: 5px;"></span>
          </div>

          <div class="form-group">
            <label class="card__label" for="date">Log Date <span style="color: var(--expense);">*</span></label>
            <input type="date" id="date" class="form-input"/>
            <span id="error-date" style="color: var(--expense); font-size: 10px; display: block; margin-top: 5px;"></span>
          </div>
        </div>

        <div class="form-group">
          <label class="card__label" for="category">Classification <span style="color: var(--expense);">*</span></label>
          <select id="category" class="form-input" style="background: var(--bg-surface); cursor: pointer;">
            <option value="">-- Select Category --</option>
            <optgroup label="Expenditure">
              <option value="Education">Education</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Leisure</option>
              <option value="Other Expense">Other</option>
            </optgroup>
            <optgroup label="Revenue">
              <option value="Salary">Salary</option>
              <option value="Freelance">Freelance</option>
              <option value="Investment">Investment</option>
              <option value="Gift">Gift</option>
              <option value="Other Income">Other</option>
            </optgroup>
          </select>
          <span id="error-category" style="color: var(--expense); font-size: 10px; display: block; margin-top: 5px;"></span>
        </div>

        <div class="form-group">
          <label class="card__label" for="note">Field Notes (Optional)</label>
          <textarea id="note" class="form-input" placeholder="Additional details..." rows="3" style="resize: none;"></textarea>
        </div>

        <div style="margin-top: 40px; display: flex; gap: 15px;">
          <button type="submit" class="btn-primary" style="flex: 2;">Commit Transaction</button>
          <button type="reset" id="clear-btn" style="flex: 1; background: transparent; border: 1px solid var(--border); color: var(--text-muted); font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; cursor: pointer;">Reset</button>
        </div>

        <div id="success-msg" style="margin-top: 20px; text-align: center; font-family: var(--font-mono); font-size: 12px; color: var(--income);"></div>

      </form>
    </div>
  </main>

  <footer style="text-align: center; margin-top: 80px; padding-bottom: 40px; color: var(--text-muted); font-size: 10px; letter-spacing: 2px;">
    FINTRACK &copy; 2026 | CSE 106 PROJECT
  </footer>

  <script>
    const Storage = (() => {
      const TK = 'fintrack_transactions';
      return {
        get: () => JSON.parse(localStorage.getItem(TK) || '[]'),
        save: (list) => localStorage.setItem(TK, JSON.stringify(list)),
        add: (t) => {
          const list = JSON.parse(localStorage.getItem(TK) || '[]');
          t.id = Date.now().toString();
          list.unshift(t);
          localStorage.setItem(TK, JSON.stringify(list));
        }
      };
    })();

    function setTodayDate() {
      const today = new Date().toISOString().split('T')[0];
      const dateEl = document.getElementById('date');
      dateEl.value = today;
      dateEl.max = today;
    }

    function initTypeToggle() {
      const btnExp = document.getElementById('btn-expense');
      const btnInc = document.getElementById('btn-income');
      const typeInp = document.getElementById('transaction-type');

      btnExp.addEventListener('click', () => {
        btnExp.style.background = 'var(--expense)';
        btnExp.style.color = 'var(--text-primary)';
        btnInc.style.background = 'transparent';
        typeInp.value = 'expense';
      });

      btnInc.addEventListener('click', () => {
        btnInc.style.background = 'var(--income)';
        btnInc.style.color = 'var(--text-primary)';
        btnExp.style.background = 'transparent';
        typeInp.value = 'income';
      });
    }

    function validateForm() {
      let isValid = true;
      ['title', 'amount', 'category', 'date'].forEach(id => {
        document.getElementById(`error-${id}`).textContent = '';
      });

      const title = document.getElementById('title').value.trim();
      const amount = document.getElementById('amount').value;
      const category = document.getElementById('category').value;
      const date = document.getElementById('date').value;

      if (!title || title.length < 2) {
        document.getElementById('error-title').textContent = 'Title required (min 2 chars).';
        isValid = false;
      }
      if (!amount || parseFloat(amount) <= 0) {
        document.getElementById('error-amount').textContent = 'Valid amount required.';
        isValid = false;
      }
      if (!category) {
        document.getElementById('error-category').textContent = 'Select a classification.';
        isValid = false;
      }
      if (!date) {
        document.getElementById('error-date').textContent = 'Date required.';
        isValid = false;
      }

      return isValid;
    }

    document.getElementById('transaction-form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!validateForm()) return;

      const t = {
        title: document.getElementById('title').value.trim(),
        amount: parseFloat(document.getElementById('amount').value),
        category: document.getElementById('category').value,
        date: document.getElementById('date').value,
        note: document.getElementById('note').value.trim(),
        type: document.getElementById('transaction-type').value
      };

      Storage.add(t);

      const msg = document.getElementById('success-msg');
      msg.textContent = '✓ ENTRY COMMITTED TO LEDGER';
      
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1500);
    });

    document.addEventListener('DOMContentLoaded', () => {
      setTodayDate();
      initTypeToggle();
    });
  </script>

</body>
</html>
