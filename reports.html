<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FinTrack | Reports</title>
  <link rel="stylesheet" href="css/style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <nav class="navbar">
    <div class="navbar__inner">
      <div class="navbar__logo">FinTrack</div>
      <ul class="navbar__nav">
        <li><a href="index.html" class="navbar__link">Dashboard</a></li>
        <li><a href="add-transaction.html" class="navbar__link">Add</a></li>
        <li><a href="history.html" class="navbar__link">History</a></li>
        <li><a href="reports.html" class="navbar__link active">Reports</a></li>
      </ul>
    </div>
  </nav>

  <main class="page-container">
    <header style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 40px;">
      <div>
        <span class="card__label">Analytical Insights</span>
        <h1 style="font-family: var(--font-display); letter-spacing: -1px;">Expenditure Reports</h1>
      </div>
      <div style="text-align: right;">
        <label class="card__label" for="report-month">Filter Period</label>
        <input type="month" id="report-month" class="form-input" style="width: auto; padding: 5px;">
      </div>
    </header>

    <section class="dashboard-grid" style="margin-top: 0;">
      <div class="card">
        <span class="card__label">Period Revenue</span>
        <div class="card__value text-positive" id="report-income">₹0.00</div>
      </div>
      <div class="card">
        <span class="card__label">Period Expenditure</span>
        <div class="card__value text-negative" id="report-expense">₹0.00</div>
      </div>
      <div class="card">
        <span class="card__label">Net Savings</span>
        <div class="card__value" id="report-net">₹0.00</div>
      </div>
    </section>

    <section style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 40px;">
      <div class="card">
        <h2 class="card__label" style="margin-bottom: 20px;">Allocation by Category</h2>
        <canvas id="category-chart"></canvas>
      </div>
      <div class="card">
        <h2 class="card__label" style="margin-bottom: 20px;">Cash Flow Analysis</h2>
        <canvas id="flow-chart"></canvas>
      </div>
    </section>

    <section style="margin-top: 40px;">
      <div class="card">
        <h2 class="card__label" style="margin-bottom: 20px;">Category Breakdown</h2>
        <div style="overflow-x: auto;">
          <table style="width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 12px;">
            <thead>
              <tr style="border-bottom: 1px solid var(--border); text-align: left;">
                <th style="padding: 10px; color: var(--text-muted);">CATEGORY</th>
                <th style="padding: 10px; color: var(--text-muted);">COUNT</th>
                <th style="padding: 10px; color: var(--text-muted);">TOTAL</th>
                <th style="padding: 10px; color: var(--text-muted);">WEIGHT (%)</th>
              </tr>
            </thead>
            <tbody id="breakdown-body">
              </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer style="text-align: center; margin-top: 80px; padding-bottom: 40px; color: var(--text-muted); font-size: 10px; letter-spacing: 2px;">
    FINTRACK © 2026 | DATA ANALYTICS MODULE
  </footer>

  <script>
    // Configuration for Dark Academia Chart Theme
    const chartTheme = {
      gold: '#C5A059',
      emerald: '#5A8A6E',
      oxblood: '#8A3A3A',
      text: '#A09C92',
      border: '#2E2B27'
    };

    function initReports() {
      const txns = JSON.parse(localStorage.getItem('fintrack_transactions') || '[]');
      const monthInput = document.getElementById('report-month');
      
      // Default to current month if not set
      if (!monthInput.value) {
        const now = new Date();
        monthInput.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      }

      const filtered = txns.filter(t => t.date.startsWith(monthInput.value));
      updateUI(filtered);
    }

    function updateUI(data) {
      let income = 0, expense = 0;
      const categories = {};

      data.forEach(t => {
        if (t.type === 'income') {
          income += t.amount;
        } else {
          expense += t.amount;
          categories[t.category] = (categories[t.category] || 0) + t.amount;
        }
      });

      // Update Summary
      document.getElementById('report-income').textContent = `₹${income.toLocaleString()}`;
      document.getElementById('report-expense').textContent = `₹${expense.toLocaleString()}`;
      document.getElementById('report-net').textContent = `₹${(income - expense).toLocaleString()}`;

      renderTable(categories, expense, data);
      renderCharts(categories, income, expense);
    }

    function renderTable(cats, totalExp, allData) {
      const body = document.getElementById('breakdown-body');
      body.innerHTML = Object.keys(cats).map(cat => {
        const amount = cats[cat];
        const count = allData.filter(d => d.category === cat).length;
        const pct = totalExp > 0 ? ((amount / totalExp) * 100).toFixed(1) : 0;
        return `
          <tr style="border-bottom: 1px solid var(--border);">
            <td style="padding: 12px;">${cat}</td>
            <td style="padding: 12px;">${count}</td>
            <td style="padding: 12px;">₹${amount.toLocaleString()}</td>
            <td style="padding: 12px; color: var(--gold);">${pct}%</td>
          </tr>
        `;
      }).join('') || '<tr><td colspan="4" style="padding: 20px; text-align: center;">No data for this period.</td></tr>';
    }

    let catChart, flowChart;

    function renderCharts(cats, inc, exp) {
      const ctx1 = document.getElementById('category-chart').getContext('2d');
      const ctx2 = document.getElementById('flow-chart').getContext('2d');

      if (catChart) catChart.destroy();
      if (flowChart) flowChart.destroy();

      catChart = new Chart(ctx1, {
        type: 'doughnut',
        data: {
          labels: Object.keys(cats),
          datasets: [{
            data: Object.values(cats),
            backgroundColor: [chartTheme.gold, chartTheme.emerald, chartTheme.oxblood, '#4A4642', '#7A746E'],
            borderColor: '#1a1a1a',
            borderWidth: 2
          }]
        },
        options: { plugins: { legend: { labels: { color: chartTheme.text, font: { family: 'DM Mono' } } } } }
      });

      flowChart = new Chart(ctx2, {
        type: 'bar',
        data: {
          labels: ['Revenue', 'Expenditure'],
          datasets: [{
            label: 'Amount in ₹',
            data: [inc, exp],
            backgroundColor: [chartTheme.emerald, chartTheme.oxblood]
          }]
        },
        options: {
          scales: {
            y: { ticks: { color: chartTheme.text }, grid: { color: chartTheme.border } },
            x: { ticks: { color: chartTheme.text }, grid: { display: false } }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    document.getElementById('report-month').addEventListener('change', initReports);
    document.addEventListener('DOMContentLoaded', initReports);
  </script>
</body>
</html>
