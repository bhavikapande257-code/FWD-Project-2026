
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FinTrack | Logs</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="navbar__inner">
      <div class="navbar__logo">FinTrack</div>
      <ul class="navbar__nav">
        <li><a href="index.html" class="navbar__link">Dashboard</a></li>
        <li><a href="add-transaction.html" class="navbar__link">Add</a></li>
        <li><a href="history.html" class="navbar__link active">History</a></li>
        <li><a href="reports.html" class="navbar__link">Reports</a></li>
      </ul>
    </div>
  </nav>

  <main class="page-container">
    <header style="margin-bottom: 40px;">
      <h1 style="font-family: var(--font-display);">Transaction Archive</h1>
      <p class="card__label">Complete historical data from local storage</p>
    </header>

    <div class="recent-list" id="full-history">
      </div>

    <button id="clear-data" style="margin-top: 40px; background: transparent; border: 1px solid var(--expense); color: var(--expense); padding: 8px 16px; font-family: var(--font-mono); font-size: 10px; cursor: pointer;">
      WIPE LOCAL DATA
    </button>
  </main>

  <script>
    function renderHistory() {
      const txns = JSON.parse(localStorage.getItem('fintrack_transactions') || '[]');
      const container = document.getElementById('full-history');
      
      container.innerHTML = txns.map(t => `
        <div class="recent-item">
          <div style="width: 100px; font-size: 11px; color: var(--text-muted);">${t.date}</div>
          <div class="recent-item__info">
            <span class="recent-item__name">${t.title}</span>
            <span class="recent-item__meta">${t.category}</span>
          </div>
          <div class="card__value ${t.type === 'income' ? 'text-positive' : 'text-negative'}" style="font-size: 16px;">
            ${t.type === 'income' ? '+' : '-'}₹${t.amount.toLocaleString()}
          </div>
        </div>
      `).join('') || '<p style="padding: 40px; text-align: center; color: var(--text-muted);">Archive is currently empty.</p>';
    }

    document.getElementById('clear-data').addEventListener('click', () => {
      if(confirm("Confirm deletion of all transaction records?")) {
        localStorage.removeItem('fintrack_transactions');
        renderHistory();
      }
    });

    document.addEventListener('DOMContentLoaded', renderHistory);
  </script>
</body>
</html>
